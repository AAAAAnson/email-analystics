services:
  # PostgreSQL + pgvector 向量数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: email-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emailbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emailbot123}
      POSTGRES_DB: ${POSTGRES_DB:-emailbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # 外部用5433，避免与NAS已有PostgreSQL冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: email-redis
    ports:
      - "6380:6379"  # 外部用6380，避免冲突
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-backend
    ports:
      - "9090:9090"
      - "9092:9092"
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_IMAP_SERVER=${EMAIL_IMAP_SERVER:-imap.163.com}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT:-993}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER:-smtp.163.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-465}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DATABASE_URL=${DATABASE_URL:-postgresql://emailbot:emailbot123@postgres:5432/emailbot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - email-network
    restart: unless-stopped

  # Celery Worker 异步任务
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_IMAP_SERVER=${EMAIL_IMAP_SERVER:-imap.163.com}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT:-993}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DATABASE_URL=${DATABASE_URL:-postgresql://emailbot:emailbot123@postgres:5432/emailbot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - email-network
    restart: unless-stopped

  # Celery Beat 定时任务
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://emailbot:emailbot123@postgres:5432/emailbot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    networks:
      - email-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-frontend
    ports:
      - "9091:80"
    depends_on:
      - backend
    networks:
      - email-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  email-network:
    driver: bridge
